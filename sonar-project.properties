sonar.projectKey=tropical-management-v1
sonar.projectName=Tropical Management V1
sonar.sourceEncoding=UTF-8

# Production sources. Go unit tests are excluded from source analysis below and
# declared explicitly under sonar.tests so source/test scope never overlaps.
sonar.sources=services,internal,web/app,web/components,web/lib
sonar.tests=services,internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/node_modules/**,**/.next/**,**/.git/**,**/coverage/**,web/public/**

# Keep coverage.out as the native Go artifact. coverage.sonar.out is generated
# separately with repo-relative source paths so Sonar can resolve every file.
sonar.go.coverage.reportPaths=coverage.sonar.out
sonar.go.tests.reportPaths=go-test.json

# Generated/runtime files should not participate in duplicate/security scans.
sonar.cpd.exclusions=**/*_test.go
