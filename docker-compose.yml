services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_USER: tropical
      MYSQL_PASSWORD: tropical
    # Internal-only database. Application services reach mysql:3306 via Compose DNS.
    expose: ["3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal-root-only"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth-service:
    build: {context: ., dockerfile: Dockerfile.backend, args: {SERVICE: auth-service}}
    environment:
      AUTH_DB_DSN: tropical:tropical@tcp(mysql:3306)/tropical_auth?parseTime=true&charset=utf8mb4
      JWT_SECRET: local-dev-secret-change-this-value
      BOOTSTRAP_ADMIN_EMAIL: admin@tropical.local
      BOOTSTRAP_ADMIN_PASSWORD: ChangeThis123!
    depends_on: {mysql: {condition: service_healthy}}
    expose: ["8080"]

  audit-service:
    build: {context: ., dockerfile: Dockerfile.backend, args: {SERVICE: audit-service}}
    environment: {AUDIT_DB_DSN: "tropical:tropical@tcp(mysql:3306)/tropical_audit?parseTime=true&charset=utf8mb4"}
    depends_on: {mysql: {condition: service_healthy}}
    expose: ["8080"]

  inventory-service:
    build: {context: ., dockerfile: Dockerfile.backend, args: {SERVICE: inventory-service}}
    environment: {INVENTORY_DB_DSN: "tropical:tropical@tcp(mysql:3306)/tropical_inventory?parseTime=true&charset=utf8mb4"}
    depends_on: {mysql: {condition: service_healthy}}
    expose: ["8080"]

  sales-service:
    build: {context: ., dockerfile: Dockerfile.backend, args: {SERVICE: sales-service}}
    environment: {SALES_DB_DSN: "tropical:tropical@tcp(mysql:3306)/tropical_sales?parseTime=true&charset=utf8mb4"}
    depends_on: {mysql: {condition: service_healthy}}
    expose: ["8080"]

  dashboard-service:
    build: {context: ., dockerfile: Dockerfile.backend, args: {SERVICE: dashboard-service}}
    environment:
      SALES_SERVICE_URL: http://sales-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
    depends_on: [sales-service, audit-service, inventory-service]
    expose: ["8080"]

  api-gateway:
    build: {context: ., dockerfile: Dockerfile.backend, args: {SERVICE: api-gateway}}
    environment:
      JWT_SECRET: local-dev-secret-change-this-value
      CORS_ORIGIN: http://localhost:3000
      AUTH_SERVICE_URL: http://auth-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      SALES_SERVICE_URL: http://sales-service:8080
      DASHBOARD_SERVICE_URL: http://dashboard-service:8080
    depends_on: [auth-service, audit-service, inventory-service, sales-service, dashboard-service]
    ports: ["8080:8080"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8080"}
    depends_on: [api-gateway]
    ports: ["3000:3000"]

volumes:
  mysql-data:
